<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f6f2"><meta name="description" content="Organizá cursos, videos, notas y bloques de estudio.">
<link rel="manifest" href="manifest.json">
<title>Estudio — Mi espacio</title>
<style>
:root{--bg:#f4f6f2;--panel:#fff;--ink:#17231f;--muted:#697770;--line:#e0e7e1;--accent:#187c68;--accent2:#dff3eb;--warn:#fff0d8;--shadow:0 8px 28px #173b2510}
[data-theme=dark]{--bg:#101815;--panel:#1a2420;--ink:#e9f1ec;--muted:#a2b1a8;--line:#2c3932;--accent:#75d8b8;--accent2:#203c32;--warn:#43341f;--shadow:0 8px 28px #0003}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;padding-bottom:84px}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;border-radius:13px;padding:11px 14px;background:var(--accent);color:#fff;font-weight:650}button.secondary{background:var(--accent2);color:var(--ink)}button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}button.danger{background:#b94343}input,textarea,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);outline-color:var(--accent)}textarea{min-height:100px;resize:vertical}label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:10px 0 5px}.wrap{max-width:820px;margin:auto;padding:16px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 16px 12px;max-width:820px;margin:auto}.brand{font-size:24px;font-weight:850;letter-spacing:-.8px}.sub{color:var(--muted);font-size:13px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0;box-shadow:var(--shadow)}.hero{background:linear-gradient(135deg,var(--accent2),var(--panel));padding:20px}.hero h1{font-size:26px;line-height:1.1;margin:6px 0 8px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}.stat{background:var(--panel);border:1px solid var(--line);padding:12px;border-radius:14px}.stat strong{display:block;font-size:22px}.stat span{font-size:12px;color:var(--muted)}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.grow{flex:1;min-width:0}.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:10}.tab{background:transparent;color:var(--muted);padding:7px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;min-width:60px}.tab span{font-size:20px}.tab.active{color:var(--accent)}.section-title{font-size:19px;font-weight:800;margin:20px 0 8px}.course{display:flex;gap:12px;align-items:center}.tile{width:48px;height:48px;flex-shrink:0;border-radius:15px;background:var(--accent2);display:grid;place-items:center;font-size:23px}.pill{display:inline-block;border-radius:999px;padding:4px 9px;background:var(--accent2);font-size:12px;color:var(--accent);font-weight:700}.muted{color:var(--muted)}.progress{height:7px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0}.progress i{display:block;height:100%;background:var(--accent);width:0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions button{flex:1}.hidden{display:none!important}.video-box{aspect-ratio:16/9;border-radius:14px;background:var(--bg);display:grid;place-items:center;overflow:hidden;margin:10px 0}.video-box iframe,.video-box video{width:100%;height:100%;border:0}.note{white-space:pre-wrap;background:var(--bg);border-radius:12px;padding:12px}.item{padding:13px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.check{width:22px;height:22px;accent-color:var(--accent)}.timer{font-size:54px;font-weight:850;letter-spacing:-2px;text-align:center;font-variant-numeric:tabular-nums}.timer-ring{border:8px solid var(--accent2);border-top-color:var(--accent);border-radius:50%;width:210px;height:210px;margin:20px auto;display:flex;flex-direction:column;justify-content:center;align-items:center}.timer-ring small{font-size:13px;color:var(--muted);letter-spacing:0}.empty{text-align:center;padding:26px 12px;color:var(--muted)}.small{font-size:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.photo{width:100%;max-height:240px;object-fit:contain;border-radius:12px;background:var(--bg);margin-top:8px}.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;z-index:20;max-width:90%;text-align:center}.footer-note{font-size:12px;color:var(--muted);line-height:1.5}@media(min-width:650px){.wrap{padding:20px}.stats{gap:12px}.panel{padding:20px}}
</style></head>
<body>
<header class="top"><div><div class="brand">✦ Estudio</div><div class="sub">Tu espacio para aprender, a tu ritmo</div></div><button class="ghost" id="themeBtn" aria-label="Cambiar tema">☾</button></header>
<main class="wrap" id="app"></main>
<nav class="tabs">
<button class="tab active" data-page="home"><span>⌂</span>Inicio</button>
<button class="tab" data-page="courses"><span>▤</span>Cursos</button>
<button class="tab" data-page="timer"><span>◷</span>Estudiar</button>
<button class="tab" data-page="review"><span>✧</span>Repasar</button>
<button class="tab" data-page="settings"><span>⚙</span>Más</button>
</nav>
<div id="toast" class="toast hidden"></div>
<input id="importFile" type="file" accept="application/json" class="hidden">
<script>
const DBKEY='estudio-v1';
let state=load(), page='home', selectedCourse=null, selectedTopic=null, timerInterval=null, remaining=25*60, timerMode='study', running=false;
function load(){try{return JSON.parse(localStorage.getItem(DBKEY))||{courses:[],sessions:[],theme:'light',settings:{study:25,rest:5,cycles:4}}}catch(e){return {courses:[],sessions:[],theme:'light',settings:{study:25,rest:5,cycles:4}}}}
function save(){localStorage.setItem(DBKEY,JSON.stringify(state));document.documentElement.dataset.theme=state.theme==='dark'?'dark':'light';}
function id(){return Math.random().toString(36).slice(2,10)}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2400)}
function allTopics(){return state.courses.flatMap(c=>(c.topics||[]).map(t=>({...t,courseName:c.name,courseId:c.id})))}
function progress(c){let ts=c.topics||[];return ts.length?Math.round(ts.filter(t=>t.done).length/ts.length*100):0}
function totalDone(){return allTopics().filter(t=>t.done).length}
function totalMinutes(){return state.sessions.reduce((a,s)=>a+(s.minutes||0),0)}
function setPage(p){page=p;selectedCourse=null;selectedTopic=null;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
function render(){save();const root=document.getElementById('app');if(page==='home')root.innerHTML=home();else if(page==='courses')root.innerHTML=coursesPage();else if(page==='timer')root.innerHTML=timerPage();else if(page==='review')root.innerHTML=reviewPage();else root.innerHTML=settingsPage();bind()}
function home(){let recent=[...state.courses].slice(-3).reverse();return `<section class="panel hero"><div class="pill">TU PROGRESO</div><h1>Un paso a la vez.<br>Todo suma.</h1><div class="sub">Aprendé con intención, descansá y registrá lo que descubrís.</div><div class="stats"><div class="stat"><strong>${state.courses.length}</strong><span>Cursos</span></div><div class="stat"><strong>${totalDone()}</strong><span>Temas listos</span></div><div class="stat"><strong>${Math.floor(totalMinutes()/60)}h ${totalMinutes()%60}m</strong><span>Estudiados</span></div></div></section>
<div class="row between"><div class="section-title">Continuar aprendiendo</div><button class="secondary" data-action="new-course">＋ Curso</button></div>
${recent.length?recent.map(courseCard).join(''):`<section class="panel empty"><div style="font-size:34px">📚</div><b>Tu primer curso empieza acá</b><p>Creá un curso, agregá temas y guardá los videos que estás estudiando.</p><button data-action="new-course">Crear mi primer curso</button></section>`}
<section class="panel"><div class="row between"><div><b>¿Listo para concentrarte?</b><div class="sub">Un bloque corto también es progreso.</div></div><button data-go="timer">Empezar →</button></div></section>`}
function courseCard(c){return `<section class="panel"><div class="course"><div class="tile">📘</div><div class="grow"><b>${esc(c.name)}</b><div class="sub">${(c.topics||[]).length} temas · ${progress(c)}% completado</div><div class="progress"><i style="width:${progress(c)}%"></i></div></div><button class="secondary" data-action="open-course" data-id="${c.id}">Abrir</button></div></section>`}
function coursesPage(){return `<div class="row between"><div><div class="section-title" style="margin-top:6px">Mis cursos</div><div class="sub">Organizá cursos, temas y videos en un solo lugar.</div></div><button data-action="new-course">＋ Nuevo</button></div>${state.courses.length?state.courses.map(courseCard).join(''):`<section class="panel empty">Todavía no hay cursos.<br><br><button data-action="new-course">Crear un curso</button></section>`}`}
function courseDetail(c){return `<button class="ghost" data-action="back-courses">← Mis cursos</button><section class="panel hero"><div class="pill">${progress(c)}% COMPLETADO</div><h1>${esc(c.name)}</h1><p class="sub">${esc(c.description||'Tu espacio de aprendizaje')}</p><div class="progress"><i style="width:${progress(c)}%"></i></div><div class="actions"><button data-action="new-topic" data-id="${c.id}">＋ Agregar tema o video</button><button class="secondary" data-action="edit-course" data-id="${c.id}">Editar curso</button></div></section><div class="section-title">Temas y videos</div>${(c.topics||[]).length?(c.topics||[]).map(t=>`<section class="panel"><div class="row"><input class="check" type="checkbox" data-action="toggle-topic" data-id="${t.id}" ${t.done?'checked':''}><div class="grow"><b>${esc(t.name)}</b><div class="sub">${t.done?'Terminado':'En curso'}${t.videoUrl?' · Video guardado':''}</div></div><button class="secondary" data-action="open-topic" data-id="${t.id}">Ver</button></div></section>`).join(''):`<section class="panel empty">Agregá el primer tema. Podés asociarle un video, subtemas, notas e imágenes.</section>`}<button class="danger" data-action="delete-course" data-id="${c.id}">Eliminar curso</button>`}
function topicDetail(c,t){let url=esc(t.videoUrl||'');let yt=ytEmbed(t.videoUrl||'');return `<button class="ghost" data-action="back-course" data-id="${c.id}">← ${esc(c.name)}</button><section class="panel"><div class="row between"><div class="grow"><div class="sub">TEMA</div><h1 style="margin:4px 0">${esc(t.name)}</h1></div><label style="margin:0;color:var(--ink)"><input class="check" type="checkbox" data-action="toggle-topic" data-id="${t.id}" ${t.done?'checked':''}> Terminado</label></div>${t.videoUrl?`<div class="video-box">${yt?`<iframe src="${yt}" allowfullscreen title="Video de estudio"></iframe>`:`<a href="${url}" target="_blank" rel="noopener">▶ Abrir video guardado</a>`}</div><div class="sub">${url}</div>`:`<div class="video-box">🎬 <span class="muted">Todavía no agregaste un video</span></div>`}<div class="actions"><button data-action="edit-topic" data-id="${t.id}">Editar tema</button><button class="secondary" data-action="new-subtopic" data-id="${t.id}">＋ Subtema</button></div></section>
<section class="panel"><div class="row between"><h3 style="margin:0">Subtemas</h3><span class="pill">${(t.subtopics||[]).filter(x=>x.done).length}/${(t.subtopics||[]).length}</span></div>${(t.subtopics||[]).length?(t.subtopics||[]).map(s=>`<div class="item row"><input class="check" type="checkbox" data-action="toggle-sub" data-topic="${t.id}" data-id="${s.id}" ${s.done?'checked':''}><span class="grow">${esc(s.name)}</span><button class="ghost" data-action="delete-sub" data-topic="${t.id}" data-id="${s.id}">×</button></div>`).join(''):`<p class="sub">Dividí el tema en partes pequeñas para avanzar de a poco.</p>`}</section>
<section class="panel"><h3 style="margin-top:0">Mis notas</h3><textarea id="topicNotes" placeholder="¿Qué aprendiste? Escribí ideas, ejemplos, dudas o un resumen...">${esc(t.notes||'')}</textarea><div class="actions"><button data-action="save-notes" data-id="${t.id}">Guardar notas</button></div></section>
<section class="panel"><div class="row between"><h3 style="margin:0">Imágenes y material</h3><label class="pill" style="cursor:pointer">＋ Adjuntar imagen<input id="imageUpload" type="file" accept="image/*" multiple class="hidden"></label></div><div id="imagesArea">${(t.images||[]).map((im,i)=>`<div class="item"><img class="photo" src="${im.data}" alt="${esc(im.name)}"><div class="row between"><span class="sub">${esc(im.name)}</span><button class="ghost" data-action="delete-image" data-id="${t.id}" data-index="${i}">Quitar</button></div></div>`).join('')||'<p class="sub">Podés guardar capturas de pantalla, gráficos o fotos de tus apuntes.</p>'}</div></section>
<section class="panel"><h3 style="margin-top:0">Repaso rápido</h3><label>Pregunta para tu próximo repaso</label><textarea id="reviewQuestion" placeholder="Ej.: ¿Cuáles son las tres ideas principales?">${esc(t.reviewQuestion||'')}</textarea><label>Respuesta / recordatorio</label><textarea id="reviewAnswer" placeholder="Anotá la respuesta con tus palabras.">${esc(t.reviewAnswer||'')}</textarea><button data-action="save-review" data-id="${t.id}">Guardar repaso</button></section>`}
function ytEmbed(u){try{let x=new URL(u);if(x.hostname.includes('youtu.be'))return 'https://www.youtube-nocookie.com/embed/'+x.pathname.slice(1);if(x.hostname.includes('youtube.com')){let id=x.searchParams.get('v');if(!id&&x.pathname.includes('/embed/'))id=x.pathname.split('/embed/')[1];if(id)return 'https://www.youtube-nocookie.com/embed/'+id}}catch(e){}return ''}
function timerPage(){let s=state.settings;return `<section class="panel"><div class="pill">MODO CONCENTRACIÓN</div><h1 style="margin-bottom:4px">Tu próximo bloque</h1><p class="sub">Elegí una tarea, concentráte y descansá sin culpa.</p><label>¿Qué vas a estudiar?</label><select id="timerTopic"><option value="">Elegir tema (opcional)</option>${allTopics().map(t=>`<option value="${t.id}">${esc(t.courseName)} — ${esc(t.name)}</option>`).join('')}</select><div class="timer-ring"><small id="timerLabel">${timerMode==='study'?'ESTUDIO':'DESCANSO'}</small><div class="timer" id="timerDisplay">${fmt(remaining)}</div></div><div class="actions"><button id="timerStart">${running?'Pausar':'Comenzar'}</button><button class="secondary" id="timerReset">Reiniciar</button></div><div class="grid2" style="margin-top:18px"><div><label>Estudio (min)</label><input id="studyMins" type="number" min="1" max="180" value="${s.study}"></div><div><label>Descanso (min)</label><input id="restMins" type="number" min="1" max="60" value="${s.rest}"></div></div><button class="ghost" style="width:100%;margin-top:10px" data-action="save-timer-settings">Guardar tiempos</button><p class="footer-note">Mantené la app abierta durante el bloque para que el temporizador funcione de forma fiable. Al finalizar un bloque de estudio se registra el tiempo.</p></section><section class="panel"><b>Sesiones completadas</b><div class="sub">${state.sessions.length} bloques registrados · ${totalMinutes()} minutos de estudio</div></section>`}
function fmt(n){return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function reviewPage(){let ts=allTopics().filter(t=>t.reviewQuestion||!t.done);return `<div class="section-title" style="margin-top:6px">Repasar lo aprendido</div><p class="sub">Volvé sobre tus notas y comprobá qué recordás sin mirar.</p>${ts.length?ts.map(t=>`<section class="panel"><div class="pill">${esc(t.courseName)}</div><h3>${esc(t.name)}</h3>${t.reviewQuestion?`<details><summary><b>${esc(t.reviewQuestion)}</b></summary><p>${esc(t.reviewAnswer||'Todavía no escribiste una respuesta.')}</p></details>`:`<p class="sub">Este tema está pendiente o en progreso. Abrilo para crear una pregunta de repaso.</p>`}<div class="actions"><button class="secondary" data-action="review-topic" data-id="${t.id}">Abrir tema</button></div></section>`).join(''):`<section class="panel empty">¡Buen trabajo! No hay temas pendientes de repaso. Podés agregar preguntas dentro de cualquier tema.</section>`}`}
function settingsPage(){return `<div class="section-title" style="margin-top:6px">Más opciones</div><section class="panel"><h3 style="margin-top:0">Apariencia</h3><div class="row between"><div><b>Tema visual</b><div class="sub">Claro u oscuro</div></div><button class="secondary" data-action="toggle-theme">${state.theme==='dark'?'☀ Usar claro':'☾ Usar oscuro'}</button></div></section><section class="panel"><h3 style="margin-top:0">Tus datos</h3><p class="sub">Los datos se guardan en este navegador. Exportá una copia regularmente para conservar cursos, notas y progreso.</p><div class="actions"><button data-action="export">Exportar copia</button><button class="secondary" data-action="import">Importar copia</button></div><div class="actions"><button class="ghost" data-action="export-notes">Exportar apuntes .txt</button></div></section><section class="panel"><h3 style="margin-top:0">Instalar en Android</h3><p>Cuando esta app esté publicada mediante HTTPS, abrí el enlace en Chrome y elegí <b>⋮ → Instalar aplicación</b> o <b>Agregar a pantalla principal</b>.</p><p class="footer-note">Esta carpeta es una primera versión funcional. La copia en la nube requiere conectar un servicio externo y configurar una cuenta; todavía no se sincroniza automáticamente.</p></section><section class="panel"><h3 style="margin-top:0">Resumen de aprendizaje</h3><div class="stats"><div class="stat"><strong>${state.courses.length}</strong><span>Cursos</span></div><div class="stat"><strong>${totalDone()}</strong><span>Temas listos</span></div><div class="stat"><strong>${state.sessions.length}</strong><span>Bloques</span></div></div></section>`}
function findCourseByTopic(tid){return state.courses.find(c=>(c.topics||[]).some(t=>t.id===tid))}
function findTopic(tid){let c=findCourseByTopic(tid);return c&&(c.topics||[]).find(t=>t.id===tid)}
function bind(){if(selectedCourse){let c=state.courses.find(c=>c.id===selectedCourse);if(c){document.getElementById('app').innerHTML=selectedTopic?topicDetail(c,(c.topics||[]).find(t=>t.id===selectedTopic)||c.topics[0]):courseDetail(c);bindTopicUploads();}}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>setPage(b.dataset.page));
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>setPage(b.dataset.go));
document.querySelectorAll('[data-action]').forEach(b=>{if(b.type==='checkbox')b.onchange=()=>action(b.dataset.action,b.dataset.id,b);else b.onclick=()=>action(b.dataset.action,b.dataset.id,b)});
let start=document.getElementById('timerStart');if(start)start.onclick=toggleTimer;let reset=document.getElementById('timerReset');if(reset)reset.onclick=resetTimer;
let th=document.getElementById('themeBtn');if(th)th.onclick=()=>{state.theme=state.theme==='dark'?'light':'dark';render()};
let imp=document.getElementById('importFile');if(imp)imp.onchange=importBackup;
let saveM=document.getElementById('saveNotes');if(saveM)saveM.onclick=()=>{};
let up=document.getElementById('imageUpload');if(up)up.onchange=uploadImages;
}
function bindTopicUploads(){let up=document.getElementById('imageUpload');if(up)up.onchange=uploadImages}
function action(a,id,b){switch(a){
case'new-course':courseForm();break;
case'open-course':selectedCourse=id;selectedTopic=null;render();break;
case'back-courses':selectedCourse=null;selectedTopic=null;render();break;
case'back-course':selectedCourse=id;selectedTopic=null;render();break;
case'new-topic':selectedCourse=id;topicForm();break;
case'open-topic':selectedTopic=id;render();break;
case'edit-course':courseForm(id);break;
case'edit-topic':topicForm(null,id);break;
case'toggle-topic':{let t=findTopic(id);if(t){t.done=b.checked;save();render()}break}
case'toggle-sub':{let t=findTopic(b.dataset.topic),s=t&&t.subtopics.find(s=>s.id===id);if(s)s.done=b.checked;save();render();break}
case'delete-sub':{let t=findTopic(b.dataset.topic);if(t&&confirm('¿Eliminar este subtema?')){t.subtopics=t.subtopics.filter(s=>s.id!==id);save();render()}break}
case'new-subtopic':subtopicForm(id);break;
case'save-notes':{let t=findTopic(id);if(t){t.notes=document.getElementById('topicNotes').value;save();toast('Notas guardadas')}break}
case'save-review':{let t=findTopic(id);if(t){t.reviewQuestion=document.getElementById('reviewQuestion').value;t.reviewAnswer=document.getElementById('reviewAnswer').value;save();toast('Repaso guardado')}break}
case'delete-image':{let t=findTopic(id);if(t){t.images.splice(+b.dataset.index,1);save();render()}break}
case'delete-course':if(confirm('¿Eliminar este curso y todos sus temas?')){state.courses=state.courses.filter(c=>c.id!==id);selectedCourse=null;render()}break;
case'toggle-theme':state.theme=state.theme==='dark'?'light':'dark';render();break;
case'export':exportBackup();break;
case'import':document.getElementById('importFile').click();break;
case'export-notes':exportNotes();break;
case'save-timer-settings':{let sm=Math.max(1,Math.min(180,+document.getElementById('studyMins').value||25)),rm=Math.max(1,Math.min(60,+document.getElementById('restMins').value||5));state.settings.study=sm;state.settings.rest=rm;resetTimer();save();toast('Tiempos guardados');render();break}
case'review-topic':selectedCourse=findCourseByTopic(id).id;selectedTopic=id;render();break;
}}
function courseForm(cid){let c=cid?state.courses.find(c=>c.id===cid):null;document.getElementById('app').innerHTML=`<button class="ghost" id="formBack">← Volver</button><section class="panel"><h2>${c?'Editar curso':'Crear curso'}</h2><form id="courseForm"><label>Nombre del curso *</label><input name="name" required maxlength="100" placeholder="Ej.: Inglés, Trading, Historia" value="${esc(c?.name||'')}"><label>Descripción (opcional)</label><textarea name="description" placeholder="¿Qué querés aprender?">${esc(c?.description||'')}</textarea><button style="width:100%;margin-top:14px">${c?'Guardar cambios':'Crear curso'}</button></form></section>`;document.getElementById('formBack').onclick=()=>{render()};document.getElementById('courseForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);if(c){c.name=f.get('name').trim();c.description=f.get('description').trim()}else{c={id:id(),name:f.get('name').trim(),description:f.get('description').trim(),topics:[],created:Date.now()};state.courses.push(c)}selectedCourse=c.id;selectedTopic=null;page='courses';save();render()}}
function topicForm(courseId,topicId){let c=courseId?state.courses.find(c=>c.id===courseId):findCourseByTopic(topicId),t=topicId?findTopic(topicId):null;document.getElementById('app').innerHTML=`<button class="ghost" id="formBack">← Volver</button><section class="panel"><h2>${t?'Editar tema':'Nuevo tema o video'}</h2><form id="topicForm"><label>Nombre del tema *</label><input name="name" required maxlength="140" placeholder="Ej.: Soportes y resistencias" value="${esc(t?.name||'')}"><label>Enlace al video (YouTube u otra página)</label><input name="videoUrl" type="url" placeholder="https://..." value="${esc(t?.videoUrl||'')}"><label>Descripción / objetivo</label><textarea name="notes" placeholder="¿Qué querés entender de este tema?">${esc(t?.notes||'')}</textarea><button style="width:100%;margin-top:14px">${t?'Guardar cambios':'Agregar tema'}</button></form><p class="footer-note">Para un video guardado en el teléfono, podés elegir un archivo desde el reproductor del dispositivo; el archivo no se copia a la app en esta versión.</p></section>`;document.getElementById('formBack').onclick=()=>render();document.getElementById('topicForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);if(t){t.name=f.get('name').trim();t.videoUrl=f.get('videoUrl').trim();t.notes=f.get('notes').trim()}else{t={id:id(),name:f.get('name').trim(),videoUrl:f.get('videoUrl').trim(),notes:f.get('notes').trim(),done:false,subtopics:[],images:[],reviewQuestion:'',reviewAnswer:''};c.topics.push(t)}selectedCourse=c.id;selectedTopic=t.id;page='courses';save();render()}}
function subtopicForm(tid){let t=findTopic(tid),name=prompt('Nombre del subtema:');if(name&&name.trim()){t.subtopics=t.subtopics||[];t.subtopics.push({id:id(),name:name.trim(),done:false});save();render()}}
function uploadImages(e){let t=findTopic(selectedTopic);if(!t)return;let files=[...e.target.files];files.forEach(file=>{if(file.size>2*1024*1024){toast('Cada imagen debe pesar menos de 2 MB');return}let r=new FileReader();r.onload=()=>{t.images=t.images||[];t.images.push({name:file.name,data:r.result});save();render()};r.readAsDataURL(file)});}
function toggleTimer(){if(running){clearInterval(timerInterval);running=false;document.getElementById('timerStart').textContent='Continuar';return}running=true;document.getElementById('timerStart').textContent='Pausar';timerInterval=setInterval(()=>{remaining--;let d=document.getElementById('timerDisplay');if(d)d.textContent=fmt(remaining);if(remaining<=0){clearInterval(timerInterval);running=false;if(timerMode==='study'){let mins=state.settings.study;state.sessions.push({id:id(),minutes:mins,date:new Date().toISOString(),topicId:document.getElementById('timerTopic')?.value||''});timerMode='rest';remaining=state.settings.rest*60;toast('¡Bloque terminado! Hora de descansar.')}else{timerMode='study';remaining=state.settings.study*60;toast('Descanso terminado. ¡Seguimos!')}render()}},1000)}
function resetTimer(){clearInterval(timerInterval);running=false;timerMode='study';remaining=state.settings.study*60;render()}
function exportBackup(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});download(blob,'mi-estudio-copia-'+new Date().toISOString().slice(0,10)+'.json');toast('Copia preparada')}
function importBackup(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.courses)||!Array.isArray(d.sessions))throw Error();if(confirm('Importar reemplazará los datos actuales. ¿Continuar?')){state=d;save();render();toast('Copia importada')}}catch(err){alert('El archivo no parece una copia válida de Estudio.')}e.target.value=''};r.readAsText(f)}
function exportNotes(){let txt=state.courses.map(c=>'# '+c.name+'\n'+(c.description||'')+'\n'+(c.topics||[]).map(t=>'\n## '+t.name+'\nEstado: '+(t.done?'Terminado':'En curso')+'\nVideo: '+(t.videoUrl||'')+'\n\n'+(t.notes||'')+'\n'+(t.subtopics||[]).map(s=>'- ['+(s.done?'x':' ')+'] '+s.name).join('\n')+'\nPregunta de repaso: '+(t.reviewQuestion||'')+'\nRespuesta: '+(t.reviewAnswer||'')).join('\n')).join('\n\n');download(new Blob([txt],{type:'text/plain;charset=utf-8'}),'mis-apuntes.txt')}
function download(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>setPage(b.dataset.page));
document.getElementById('themeBtn').onclick=()=>{state.theme=state.theme==='dark'?'light':'dark';render()};
document.documentElement.dataset.theme=state.theme==='dark'?'dark':'light';
render();
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
